# Nginx delante de Next.js. Copiar a /etc/nginx/sites-available/godeye,
# reemplazar jesusgarcia.kognitic.io y enlazar en sites-enabled.
#
# Next no se expone directo a internet a propósito: nginx absorbe peticiones
# malformadas, conexiones lentas y el ruido de escaneo, y deja al servidor
# dedicado a renderizar.

# Freno de fuerza bruta en el login, además del que hace la app. Este corta
# antes de que la petición llegue a Node.
limit_req_zone $binary_remote_addr zone=jesusgarcia_login:10m rate=12r/m;

server {
    listen 80;
    listen [::]:80;
    server_name jesusgarcia.kognitic.io;

    # certbot reescribe este bloque para agregar el 443 con el certificado.

    client_max_body_size 25m;

    # Las capturas y subidas de la automatización pueden tardar; el default de
    # 60s corta respuestas legítimas a la mitad.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # $proxy_add_x_forwarded_for es lo que hace que la app vea la IP real del
    # visitante: sin esto todas las peticiones parecen venir de 127.0.0.1 y el
    # límite de intentos del login se aplicaría a todo el mundo junto.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/auth/login {
        limit_req zone=jesusgarcia_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3002;
    }

    # -----------------------------------------------------------------------
    # PANTALLA DEL SERVIDOR (/pantalla) — noVNC sobre el escritorio de AdsPower
    # -----------------------------------------------------------------------
    # x11vnc corre con -nopw: quien alcance ese puerto se sienta frente al VPS,
    # con la sesión de AdsPower abierta y todos los perfiles adentro. Hasta acá
    # lo protegía no tener camino desde internet; al publicarlo en el dominio el
    # camino existe, así que lo único que lo cierra es este auth_request, que le
    # pregunta a la app si la cookie es de un administrador.
    location = /internal/vnc-auth {
        internal;
        proxy_pass http://127.0.0.1:3002/api/vnc/authorize;

        # La subpetición no lleva cuerpo, pero sin limpiar el Content-Length
        # nginx anuncia el largo del original y Node se queda esperándolo.
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    location /vnc/ {
        auth_request /internal/vnc-auth;

        # La barra final del proxy_pass es la que importa: recorta el /vnc/ y le
        # pide a websockify la ruta de adentro (/vnc.html, /app/..., etc.).
        proxy_pass http://127.0.0.1:6080/;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;

        # Una sesión abierta y quieta no manda nada durante minutos; con los
        # 300s de arriba se cortaría sola mientras alguien la está mirando.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # El WebSocket propiamente dicho. noVNC lo arma desde la raíz del dominio
    # (su ajuste `path` vale "websockify" y no hereda el /vnc/ de la página),
    # así que el destino real cuelga de acá y no de la carpeta de arriba.
    location = /websockify {
        auth_request /internal/vnc-auth;
        proxy_pass http://127.0.0.1:6080/websockify;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:3002;

        # Sin esto nginx acumula la respuesta entera antes de mandarla y las
        # páginas que usan streaming/Suspense aparecen de golpe al final.
        proxy_buffering off;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
