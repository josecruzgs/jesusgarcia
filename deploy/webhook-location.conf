# → /etc/nginx/snippets/jesusgarcia-webhook.conf
# Se enchufa con una línea dentro del server block de 443:
#     include snippets/jesusgarcia-webhook.conf;
#
# La ruta es pública porque GitHub tiene que poder llegar; lo que autentica es
# la firma HMAC del cuerpo, que valida deploy/webhook.mjs. Por eso el webhook
# solo escucha en el localhost y nunca se expone el puerto 9098 en el firewall.

location = /_deploy/github {
    proxy_pass http://127.0.0.1:9098;

    client_max_body_size 1m;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

    # El receptor contesta antes de compilar, así que la respuesta es
    # inmediata; el default de 60s alcanza y sobra.
    proxy_read_timeout 30s;
}
